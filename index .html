<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TTK Music">
<title>TTK Music</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#000000"><meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#f5f5f7;--mut:#98989f;--acc:#fa2d48;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.05);--gl:rgba(255,255,255,.16);--g1:rgba(255,255,255,.09);--g2:rgba(255,255,255,.02);--p1:#fa2d48;--p2:#ff7a59;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}html,body{margin:0;color:var(--fg);font:16px/1.4 "Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}body{min-height:100vh;background:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
main{max-width:720px;margin:0 auto;padding:16px 20px 190px}
h1{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:8px 0 16px}
h2{font-size:21px;font-weight:650;letter-spacing:-.01em;margin:26px 0 12px}
.mut,.t span{color:var(--mut)}
.glass,.row,.seg,.q,.btn.alt{background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g1));-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--gl);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.45)}
.sq,.ci,.ph{object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.sq{border-radius:16px;box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.12)}.ci{border-radius:50%;box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.12)}
.s44{width:46px;height:46px;font-size:18px}.s100{width:100px;height:100px;font-size:34px}.s140{width:140px;height:140px;font-size:46px}
.row{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;margin-bottom:10px;border-radius:22px;cursor:pointer}
.t{flex:1;min-width:0;display:flex;flex-direction:column}.t b,.t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t span{font-size:14px}
.dots{color:var(--mut);padding:8px;letter-spacing:1px}
.hrow{display:flex;gap:16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.hrow::-webkit-scrollbar{display:none}
.card{width:140px;flex:none;cursor:pointer}.card .t{margin-top:8px}.card.a{width:100px;text-align:center}.card.a .t{align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px}.grid .card{width:auto}.grid .s140{width:100%;height:auto;aspect-ratio:1}
.btn{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 78%,white),var(--acc));color:var(--on,#fff);border-radius:16px;padding:11px 18px;font-weight:600;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 8px 20px color-mix(in srgb,var(--acc) 32%,transparent)}.btn.sm{padding:7px 14px;font-size:14px}.btn.alt{color:var(--acc)}
.empty{text-align:center;padding:60px 10px}.empty p{color:var(--mut);margin-bottom:18px}
.back{color:var(--acc);font-size:17px;padding:6px 0}
.hd{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin:8px 0 6px}.hd h1{margin:0}
.story{white-space:pre-wrap;color:var(--mut);max-width:60ch}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.seg{display:flex;border-radius:16px;padding:4px;margin-bottom:16px}.seg button{flex:1;padding:8px;border-radius:12px;font-size:13px;font-weight:600;color:var(--mut)}.seg .on{background:rgba(255,255,255,.16);color:var(--fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.q{width:100%;padding:13px 18px;border-radius:20px;color:var(--fg);font:inherit;margin-bottom:8px;outline:0}
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(330px,82vw);height:64px;border-radius:34px;padding:5px;gap:4px;display:flex;z-index:20}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mut);font-weight:600}
#tabs button.on{color:var(--acc);background:rgba(255,255,255,.14);border-radius:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#mini{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);max-width:696px;margin:0 auto;height:66px;border-radius:26px;display:flex;align-items:center;gap:12px;padding:8px 12px;z-index:20;cursor:pointer}
#mini[hidden]{display:none}#mini{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 30px rgba(0,0,0,.55)}#mini .t{flex:1}.ico{width:40px;height:40px;display:grid;place-items:center;font-size:20px}
#full{position:fixed;inset:0;z-index:30;background:var(--bg);transform:translateY(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 24px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:hidden}
#full.open{transform:none}#full>*{width:100%;max-width:420px}
.grab{width:44px!important;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px;flex:none;display:block}
#cv{margin:10px auto;width:min(56vw,230px);aspect-ratio:1;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.6);transform:scale(calc(1 + var(--b,0)*.07));transition:transform .06s,box-shadow .06s;overflow:hidden;flex:none}
#cv>*{width:100%;height:100%;border-radius:0;font-size:80px}
#full h3{margin:6px 0 0;font-size:21px;text-align:center}#full .by{text-align:center;color:var(--mut);margin:0}
#bars{height:38px;margin:8px 0 2px;flex:none;display:block}
#seek{width:100%;accent-color:var(--p1);flex:none}.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);flex:none}
.ctl{display:flex;justify-content:center;align-items:center;gap:34px;flex:none;margin:6px 0}
.sk{width:44px;height:44px;display:grid;place-items:center;color:var(--fg);transition:transform .15s,opacity .15s}.sk:active{transform:scale(.88);opacity:.6}
.sk svg{width:26px;height:26px;fill:currentColor;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}
.pp{position:relative;display:grid;place-items:center;flex:none;border-radius:50%;color:var(--on,#fff);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 80%,white),var(--acc));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px rgba(0,0,0,.5);transition:transform .18s cubic-bezier(.3,.7,.2,1),filter .2s}
.pp:active{transform:scale(.92);filter:brightness(.92)}.pp.big{width:76px;height:76px}.pp.mini{width:44px;height:44px}
.pp svg{position:absolute;width:40%;height:40%;fill:currentColor;transition:opacity .2s ease,transform .32s cubic-bezier(.3,.7,.2,1)}
.pp .pi-play{transform:translateX(7%)}.pp .pi-pause{opacity:0;transform:scale(.4) rotate(-90deg)}
.pp.on .pi-play{opacity:0;transform:scale(.4) rotate(90deg)}.pp.on .pi-pause{opacity:1;transform:none}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:12px;margin:8px 2px 4px}
.sw button{aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);transition:transform .15s}.sw button:active{transform:scale(.88)}
.sw button.on{outline:2px solid #fff;outline-offset:3px}.sw .auto{background:conic-gradient(#fa2d48,#ffd60a,#30d158,#22d3ee,#2f7bff,#a259ff,#fa2d48)}
#ly{flex:1;overflow-y:auto;position:relative;margin-top:8px;text-align:center;font-size:20px;font-weight:600;line-height:1.4;scrollbar-width:none;padding:30% 0}
#ly div{padding:6px 0;color:var(--mut);opacity:.55;transition:all .25s;cursor:pointer}#ly div.on{color:var(--fg);opacity:1;transform:scale(1.04)}
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}#modal.open{display:flex}
.sheet{background:rgba(28,28,30,.72);-webkit-backdrop-filter:blur(26px) saturate(200%);backdrop-filter:blur(26px) saturate(200%);border-top:1px solid var(--gl);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}.sheet input,.sheet select,.sheet textarea{width:100%;padding:11px 12px;border-radius:10px;border:0;background:var(--card);color:var(--fg);font:inherit}.sheet textarea{min-height:130px}
.sheet .acts{margin-top:18px;justify-content:space-between}.del{color:#e5352b;font-weight:600}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-90px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:20px;z-index:60;transition:transform .3s;font-size:14px}#toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#cv{transform:none!important}#full{transition:none}}

@property --p1{syntax:"<color>";inherits:true;initial-value:#fa2d48}
@property --p2{syntax:"<color>";inherits:true;initial-value:#ff7a59}
@property --acc{syntax:"<color>";inherits:true;initial-value:#fa2d48}
:root{transition:--p1 .6s ease,--p2 .6s ease,--acc .6s ease}
#tray{perspective:800px;flex:1;min-height:150px;display:flex;align-items:center;margin-top:8px}
.prism{position:relative;width:100%;height:100%;min-height:140px;max-height:230px;border-radius:28px;transform-style:preserve-3d;overflow:hidden}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 22px;text-align:center;font-size:21px;font-weight:700;line-height:1.3;backface-visibility:hidden;text-shadow:0 2px 16px rgba(0,0,0,.4)}
.face small{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-top:8px;text-shadow:none}
.tbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 0;flex:none}
.pill{padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;color:var(--fg)}
.pill.on{color:var(--on,#fff);background:linear-gradient(180deg,color-mix(in srgb,var(--p1) 70%,white),var(--p1))}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
#djb{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-30px);opacity:0;transition:.4s;max-width:min(420px,90vw);padding:12px 18px;border-radius:20px;z-index:55;font-size:14px;text-align:center;pointer-events:none}
#djb.show{transform:translate(-50%,0);opacity:1}
#amb,#amb2{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;will-change:transform}#full>#amb2{max-width:none}.nolights #amb,.nolights #amb2{display:none}.tbar .pill{padding:7px 12px;font-size:12.5px}
</style>
</head>
<body>
<canvas id="amb"></canvas>
<main id="main"></main>
<div id="mini" class="glass" hidden></div>
<nav id="tabs" class="glass">
<button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</button>
<button data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</button>
<button data-tab="library"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>Library</button>
</nav>
<div id="full"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="djb" class="glass"></div>
<audio id="au" playsinline></audio>
<input type="file" id="imp" accept="audio/*,image/*,.mp3,.m4a,.wav,.aac,.flac" multiple hidden><input type="file" id="rst" accept=".zip,application/zip" hidden>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const S={song:[],artist:[],album:[],playlist:[]};
let db=null,tab='home',nav=[],lib='songs',curList=[];
const ls={get(){try{return JSON.parse(localStorage.getItem('ttkp')||'{}')}catch{return{}}},set(o){try{localStorage.setItem('ttkp',JSON.stringify(o))}catch{}}};
const PL=ls.get();
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('ttkmusic',1);q.onupgradeneeded=()=>q.result.createObjectStore('i',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>j()});
const put=o=>new Promise(r=>{if(!db)return r(false);try{const t=db.transaction('i','readwrite');t.objectStore('i').put(o);t.oncomplete=()=>r(true);t.onerror=t.onabort=()=>{toast('Couldn’t save that. Storage may be full.');r(false)}}catch{r(false)}});
const rm=id=>new Promise(r=>{if(!db)return r();const t=db.transaction('i','readwrite');t.objectStore('i').delete(id);t.oncomplete=r});
const all=()=>new Promise(r=>{if(!db)return r([]);const q=db.transaction('i').objectStore('i').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])});
const urls=new WeakMap();
const url=b=>{if(!b)return null;if(!urls.has(b))urls.set(b,URL.createObjectURL(b));return urls.get(b)};
const hue=s=>Math.abs([...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%360;
const img=(b,n,c)=>b?`<img class="${c}" src="${url(b)}" alt="">`:`<div class="${c} ph" style="background:linear-gradient(135deg,hsl(${hue(n)} 75% 72%),hsl(${(hue(n)+50)%360} 75% 56%))">${esc((n||'?')[0].toUpperCase())}</div>`;
const A=id=>S.artist.find(x=>x.id==id),AL=id=>S.album.find(x=>x.id==id);
const cov=s=>s.cover||AL(s.albumId)?.cover||A(s.artistId)?.photo||null;
const aname=s=>A(s.artistId)?.name||'Unknown artist';
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2400)};
const row=s=>`<div class="row" data-play="${s.id}">${img(cov(s),s.title,'sq s44')}<div class="t"><b>${esc(s.title)}</b><span>${esc(aname(s))}</span></div><button class="dots" data-edit="song:${s.id}" aria-label="Edit song">•••</button></div>`;
const acard=a=>`<div class="card a" data-go="artist:${a.id}">${img(a.photo,a.name,'ci s100')}<div class="t"><b>${esc(a.name)}</b></div></div>`;
const alcard=a=>`<div class="card" data-go="album:${a.id}">${img(a.cover,a.title,'sq s140')}<div class="t"><b>${esc(a.title)}</b><span>${esc(A(a.artistId)?.name||'Album')}</span></div></div>`;
const scard=s=>`<div class="card" data-play="${s.id}">${img(cov(s),s.title,'sq s140')}<div class="t"><b>${esc(s.title)}</b><span>${esc(aname(s))}</span></div></div>`;
const PLAY='<svg class="pi-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>',PAUSE='<svg class="pi-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4"/></svg>',PP=PLAY+PAUSE,
NXT='<svg viewBox="0 0 24 24"><path d="M5 6.5v11l9-5.5z"/><rect x="15.5" y="6" width="3" height="12" rx="1.2"/></svg>',PRV='<svg viewBox="0 0 24 24"><path d="M19 6.5v11l-9-5.5z"/><rect x="5.5" y="6" width="3" height="12" rx="1.2"/></svg>';
const plcard=p=>{const f=S.song.find(s=>s.id==(p.songIds||[])[0]);return`<div class="card" data-go="playlist:${p.id}">${img(f?cov(f):null,p.title,'sq s140')}<div class="t"><b>${esc(p.title)}</b><span>${(p.songIds||[]).length} songs</span></div></div>`};
const askBanner='<div class="glass" data-act="ask" style="display:flex;flex-direction:column;gap:2px;padding:14px 18px;border-radius:22px;cursor:pointer;margin-bottom:4px"><b>Ask DJ Vibes</b><span class="mut" style="font-size:14px">Tell me a mood and I’ll build the set.</span></div>';
const lastPlayed=s=>PL[s.id]||s.added||0;

function home(){
  if(!S.song.length)return`<h1>Home</h1><div class="empty"><p>Your library is empty. Add the songs you made and they show up here.</p><button class="btn" data-act="import">Add songs</button></div>`;
  const rec=[...S.song].sort((a,b)=>lastPlayed(b)-lastPlayed(a)).slice(0,12);curList=rec;
  return`<h1>Home</h1>${askBanner}<h2>Recent</h2><div class="hrow">${rec.map(scard).join('')}</div>`+(S.playlist.length?`<h2>Playlists</h2><div class="hrow">${S.playlist.map(plcard).join('')}</div>`:'')+
  (S.artist.length?`<h2>Artists</h2><div class="hrow">${S.artist.map(acard).join('')}</div>`:'')+
  (S.album.length?`<h2>Albums</h2><div class="grid">${S.album.map(alcard).join('')}</div>`:'');
}
function results(q){
  q=q.trim().toLowerCase();if(!q)return'<p class="mut">Search your songs, artists and albums.</p>';
  const m=x=>x.toLowerCase().includes(q);
  const ss=S.song.filter(s=>m(s.title)||m(aname(s))||m(s.lyrics||'')),as=S.artist.filter(a=>m(a.name)),ls_=S.album.filter(a=>m(a.title));curList=ss;
  return(as.length?`<h2>Artists</h2><div class="hrow">${as.map(acard).join('')}</div>`:'')+(ls_.length?`<h2>Albums</h2><div class="grid">${ls_.map(alcard).join('')}</div>`:'')+(ss.length?`<h2>Songs</h2>${ss.map(row).join('')}`:'')||'<p class="mut">Nothing found.</p>';
}
function search(){return`<h1>Search</h1><input class="q" id="q" placeholder="Songs, artists, albums" autocomplete="off"><div id="res">${results('')}</div>`}
function library(){
  const seg=`<div class="seg">${['songs','artists','albums','playlists'].map(k=>`<button data-lib="${k}" class="${lib==k?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>`;
  const add=`<div class="acts" style="margin-bottom:12px;justify-content:flex-start"><button class="btn sm" data-act="import">Add songs</button><button class="btn sm alt" data-act="newartist">New artist</button><button class="btn sm alt" data-act="newalbum">New album</button><button class="btn sm alt" data-act="settings">Settings</button></div>`;
  let b='';
  if(lib=='songs'){curList=[...S.song].sort((a,b)=>b.added-a.added);b=curList.map(row).join('')||'<p class="mut">No songs yet.</p>'}
  if(lib=='artists')b=`<div class="grid">${S.artist.map(acard).join('')||'<p class="mut">No artists yet.</p>'}</div>`;
  if(lib=='albums')b=`<div class="grid">${S.album.map(alcard).join('')||'<p class="mut">No albums yet.</p>'}</div>`;
  if(lib=='playlists')b=`<div class="grid">${S.playlist.map(plcard).join('')||'<p class="mut">No playlists yet. Ask DJ Vibes to make one.</p>'}</div>`;
  return`<h1>Library</h1>${seg}${add}${b}`;
}
function detail([k,id]){
  const back=`<button class="back" data-back>‹ Back</button>`;
  if(k=='playlist'){
    const pl=S.playlist.find(x=>x.id==id);if(!pl){nav.pop();return home()}
    const ss=(pl.songIds||[]).map(i=>S.song.find(s=>s.id==i)).filter(Boolean);curList=ss;
    return`${back}<div class="hd">${img(ss[0]?cov(ss[0]):null,pl.title,'sq s140')}<h1>${esc(pl.title)}</h1><span class="mut">${ss.length} songs</span><div class="acts"><button class="btn sm" data-act="playall">Play</button><button class="btn sm alt" data-edit="playlist:${id}">Rename</button></div></div>${ss.map(row).join('')||'<p class="mut">No songs left in this playlist.</p>'}`
  }
  if(k=='artist'){
    const a=A(id);if(!a){nav.pop();return home()}
    const ss=S.song.filter(s=>s.artistId==id);curList=ss;const als=S.album.filter(x=>x.artistId==id);

    const ok=new Map(S.song.map(s=>[s.id,s])),pick=a=>[...new Set(Array.isArray(a)?a:[])].filter(i=>ok.has(i)).map(i=>ok.get(i));
    const save=async(name,songs)=>{if(!songs.length)return null;const p={id:uid(),type:'playlist',added:Date.now(),title:String(name||'DJ Vibes mix').slice(0,60),songIds:songs.map(s=>s.id)};if(await put(p)){S.playlist.push(p);return p}return null};
    const ids=pick(j.ids),mode=j.mode,reply=String(j.reply||'Here you go.');let made=0;
    for(const p of(Array.isArray(j.playlists)?j.playlists:[])){if(await save(p&&p.name,pick(p&&p.ids)))made++}
    if(mode=='playlist'&&ids.length&&await save(j.name,ids))made++;
    let acted=made>0;
    if((mode=='play'||mode=='playlist')&&ids.length){play(ids,0);acted=true;setTimeout(()=>{if(au.paused&&Q.length)toast('Tap play to start')},1200)}
    else if(mode=='queue'&&ids.length){const c=Q[qi];if(c)Q=[...Q.slice(0,qi+1),...ids.filter(s=>s.id!=c.id)];else play(ids,0);acted=true}
    view();djSay(reply);
    if(!acted)return say(reply);
    $('#modal').classList.remove('open');
    if(made)toast(made+(made>1?' playlists':' playlist')+' saved in Library')
  }finally{asking=false}
}
function micAsk(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice input isn’t supported in this browser');
  const r=new SR();r.lang=navigator.language||'en-US';r.interimResults=false;
  r.onresult=e=>{const t=e.results[0][0].transcript,i=$('#aq');if(i){i.value=t;djAsk(t)}};r.onerror=()=>toast('Couldn’t hear that');r.start();toast('Listening…')
}
function askDJ(){
  const m=$('#modal'),SR=window.SpeechRecognition||window.webkitSpeechRecognition,n=S.song.filter(s=>s.feat).length;
  m.innerHTML=`<div class="sheet"><h2 style="margin-top:0">Ask DJ Vibes</h2><div class="pills">${CH.map((t,k)=>`<button class="glass pill" data-m="c${k}">${t}</button>`).join('')}</div><div style="display:flex;gap:8px;align-items:center;margin-top:12px"><input class="q" id="aq" placeholder="Tell DJ Vibes how you feel or what to do" autocomplete="off" style="margin:0;flex:1;width:auto">${SR?'<button class="btn sm alt" data-m="mic" aria-label="Speak"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="pointer-events:none"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>':''}<button class="btn sm" data-m="go">Go</button></div><p class="mut" id="ar" style="min-height:1.4em;margin:10px 0 0;font-size:14px"></p><p class="mut" style="font-size:13px;margin:10px 0 0">DJ Vibes picks from your titles, artists, albums, lyrics and, once it has listened, each song’s tempo and energy. Try “make me a gym playlist” or “play something to cheer me up”.</p><div class="acts"><button class="btn sm alt" data-m="listen">Let DJ Vibes listen (${n}/${S.song.length})</button><button class="btn alt" data-m="x">Close</button></div></div>`;
  m.classList.add('open');
  const i=$('#aq');i.onkeydown=e=>{if(e.key=='Enter')djAsk(i.value)};
  m.onclick=e=>{const el=e.target.closest('[data-m]'),a=el?.dataset.m;if(e.target===m||a=='x'){m.classList.remove('open');return}
    if(a=='go')djAsk(i.value);else if(a=='mic')micAsk();else if(a=='listen')listenAll();else if(a&&a.length==2&&a[0]=='c'){const t=CH[+a[1]];i.value=t;djAsk(t)}}
}

au.addEventListener('timeupdate',tick);au.addEventListener('loadedmetadata',tick);
au.addEventListener('play',()=>{wake();drawMini();document.querySelectorAll('.pp').forEach(b=>b.classList.add('on'))});
au.addEventListener('pause',()=>{drawMini();document.querySelectorAll('.pp').forEach(b=>b.classList.remove('on'))});
au.addEventListener('ended',()=>dj?djNext():next());
loop();

/* events */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-play],[data-go],[data-edit],[data-act],[data-back],[data-lib],[data-tab],[data-p]');
  if(t&&!t.closest('#modal')){
    const d=t.dataset;
    if(d.p){const p=d.p;if(p=='toggle'){e.stopPropagation();au.paused?(wake(),au.play()):au.pause()}else if(p=='next'){e.stopPropagation();next()}else if(p=='prev')prev();else if(p=='close')$('#full').classList.remove('open');else if(p=='share')lyricCard();else if(p=='dj')toggleDJ();else if(p=='out')outputs();else if(p=='ask')askDJ();return}
    if(d.edit){const[k,id]=d.edit.split(':');edit(k,id);return}
    if(d.play){const i=curList.findIndex(s=>s.id==d.play);play(curList,i<0?0:i);return}
    if(d.go){nav.push(d.go.split(':'));view();scrollTo(0,0);return}
    if(d.back){nav.pop();view();return}
    if(d.lib){lib=d.lib;view();return}
    if(d.tab){tab=d.tab;nav=[];view();scrollTo(0,0);return}
    if(d.act){const a=d.act;if(a=='import')$('#imp').click();else if(a=='newartist')edit('artist');else if(a=='newalbum')edit('album');else if(a=='settings')settings();else if(a=='ask')askDJ();else if(a=='playall'){if(curList.length)play(curList,0);else toast('No songs here yet')}else if(a.startsWith('share:'))shareAlbum(a.slice(6));return}
  }
  if(e.target.closest('#mini')&&Q.length){drawFull();$('#full').classList.add('open')}
});
document.addEventListener('input',e=>{if(e.target.id=='q')$('#res').innerHTML=results(e.target.value)});
$('#imp').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)importFiles(f)};
$('#rst').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)restore(f)};
(async()=>{
  applyLights();if(accSel()!='auto')setAccent(accSel());try{db=await idb();const items=await all();items.forEach(i=>S[i.type]?.push(i))}catch{toast('Storage is unavailable, songs won’t be kept')}
  view();
  const lp=[...S.song].sort((a,b)=>(PL[b.id]||0)-(PL[a.id]||0))[0];
  if(lp&&PL[lp.id]){Q=[...S.song];qi=Q.indexOf(lp);au.src=url(lp.audio);parseLy(lp);drawMini();setPal(cov(lp))}
})();
